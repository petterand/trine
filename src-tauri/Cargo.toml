[package]
name = "trine"
version = "0.1.0"
description = "Trine - Desktop Todo & Recurring Reminders App"
authors = ["Petter"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["notification", "fs"] }
tauri-plugin-fs = "2.0"
tauri-plugin-notification = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
